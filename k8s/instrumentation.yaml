apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: java-instrumentation
  namespace: ${namespace}
spec:
  initContainerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  exporter:
    endpoint: http://otel-daemonset-collector.${namespace}.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.31.1
    env:
      # Boas práticas para o mapeamento e tags unificadas no Datadog
      - name: OTEL_METRICS_EXPORTER
        value: "otlp"
      - name: OTEL_LOGS_EXPORTER
        value: "otlp"
      # F8-f: o MDC (sagaId, osId, correlationId, messageId) e os pares chave-valor do SLF4J (event, tipo, ...)
      # viram atributos do log OTLP, e o Datadog passa a ter as facets @osId, @sagaId, @correlationId e @event
      - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES
        value: "*"
      - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
        value: "true"
